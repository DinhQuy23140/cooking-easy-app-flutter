org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin/AGP on Windows cannot mix paths from two drive letters (e.g. project on D: and Pub
# cache on C:). You get "this and base files have different roots" on tasks such as
# :google_sign_in_android:generateDebugUnitTestConfig.
#
# Fix (pick one):
# 1) Set PUB_CACHE to a folder on the SAME drive as this repo, then: flutter clean && flutter pub get
#    Example (PowerShell): setx PUB_CACHE "D:\PubCache"
#    Close terminal/IDE, reopen, then flutter pub get from project root.
# 2) Or clone/build the project on drive C: so it shares a root with the default Pub cache.
kotlin.incremental=false
